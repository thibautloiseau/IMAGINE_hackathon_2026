team_name: data
tags:
- final
- evaluate
seed: 0
trainer:
  precision: 16-mixed
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  accelerator: gpu
  devices: 1
  max_epochs: 25
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  log_every_n_steps: 1
  enable_checkpointing: true
  enable_model_summary: true
  deterministic: false
  benchmark: true
module:
  compile: false
  _target_: src.modules.imagenet_module.ImageNetModule
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.0001
  main_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: null
    eta_min: 0
  warmup_steps: 10000.0
  warmup_scheduler:
    _target_: torch.optim.lr_scheduler.LinearLR
    _partial_: true
    start_factor: 0.01
    total_iters: ${module.warmup_steps}
  net:
    _target_: src.modules.nets.vision_transformer.VisionTransformer
    image_size: 224
    patch_size: 16
    num_layers: 12
    num_heads: 6
    hidden_dim: 384
    mlp_dim: 1536
checkpoints:
- 2_phase_training_earlier_switch/2026-07-03/09-48-27/checkpoints/last.ckpt
datamodule:
  _target_: src.datamodules.imagenet_datamodule.ImageNetDataModule
  data_path: ${paths.data_dir}
  train_dir: train
  val_dir: val
  test_dir: test_q75
  batch_size: 512
  num_workers_train: 12
  num_workers_val: 4
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  eval_resize_size: 256
  eval_crop_size: 224
  train_crop_size: 224
  interpolation: bilinear
  hflip_prob: 0.5
  auto_augment_policy: ra
  ra_magnitude: 10
  cutmix_alpha: 0.0
  mixup_alpha: 0.2
  skip_resize_crop: false
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  prediction_dir: ${paths.root_dir}/predictions/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  codecarbon_dir: ${paths.root_dir}/codecarbon/
  electricity_maps_key: ${paths.root_dir}/electricity_maps_key.txt
extras:
  ignore_warnings: true
  enforce_tags: true
  print_config: true
