_target_: src.modules.imagenet_module.ImageNetModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-3
  weight_decay: 1e-4

main_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: null # Number of epochs to anneal over; set in train.py = max_epochs - warmup_epochs.
    eta_min: 0

# Epoch-anchored, per-step LR schedule (applied in ImageNetModule.on_train_batch_start). The LR is a
# continuous function of fractional-epoch progress (current_epoch + batch_idx/num_training_batches),
# so warmup and the cosine are anchored to epochs (fixed at max_epochs) yet still change smoothly
# *within* each epoch. This keeps the schedule correct under dynamic data pruning — which changes the
# number of steps per epoch — while avoiding the "first epoch stuck at start_factor*lr" artifact of a
# purely per-epoch schedule. `main_scheduler`/`warmup_scheduler` below are reused only for their
# shape params (start_factor, eta_min); they are not instantiated as Lightning schedulers.
warmup_epochs: 4 # epochs to ramp LR from start_factor*lr up to peak lr before the cosine anneal.

warmup_scheduler:
    _target_: torch.optim.lr_scheduler.LinearLR
    _partial_: true
    start_factor: 1e-2
    total_iters: ${module.warmup_epochs}

# ViT-S/16
net:
  _target_: src.modules.nets.vision_transformer.VisionTransformer
  image_size: 224
  patch_size: 16
  num_layers: 12
  num_heads: 6
  hidden_dim: 384
  mlp_dim: 1536

