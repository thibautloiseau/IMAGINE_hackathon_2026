_target_: src.modules.imagenet_module.ImageNetModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-3
  weight_decay: 1e-4

main_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: null # Number of epochs to anneal over; set in train.py = max_epochs - warmup_epochs.
    eta_min: 0

# Epoch-based warmup. The schedulers are stepped once per epoch (interval="epoch"), so both warmup
# and the cosine are anchored to epochs (fixed at max_epochs) rather than to a dataset-size-derived
# step count. This keeps the schedule correct under dynamic data pruning: the cosine always reaches
# eta_min exactly at the final epoch, regardless of how many steps each (pruned) epoch contains.
warmup_epochs: 2 # epochs to ramp LR from start_factor*lr up to peak lr before the cosine anneal.

warmup_scheduler:
    _target_: torch.optim.lr_scheduler.LinearLR
    _partial_: true
    start_factor: 1e-2
    total_iters: ${module.warmup_epochs}

# ViT-S/16
net:
  _target_: src.modules.nets.vision_transformer.VisionTransformer
  image_size: 224
  patch_size: 16
  num_layers: 12
  num_heads: 6
  hidden_dim: 384
  mlp_dim: 1536

