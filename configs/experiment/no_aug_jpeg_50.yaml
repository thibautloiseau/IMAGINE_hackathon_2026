# @package _global_

# to execute this experiment run:
# uv run src/train.py experiment=no_aug_jpeg_50

defaults:
    - override /trainer: imagenet_vit_s_16

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
datamodule:
    hflip_prob: 0.0
    mixup_alpha: 0.0
    cutmix_alpha: 0.0
    auto_augment_policy: null
    jpeg_quality: 50

seed: 42

trainer:
    precision: 16-mixed

module:
    compile: false

# Remember to define experiment_name and tags in all your experiments!
# First tag options: data, explore, baseline, ablate, hyperparam, final, <custom tag>
# Second tag options: train, pre-train, post-train, debug, <custom tag>
experiment_name: "no_augment_jpeg_50"
tags: ["explore", "train"]
team_name: data_team
