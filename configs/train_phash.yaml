# @package _global_

# Same as train.yaml but drops near-duplicate training images using the pHash CSV.
# Run with: uv run src/train.py --config-name train_phash

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - datamodule: default
  - module: vit_s_16
  - trainer: imagenet_vit_s_16
  - logger: wandb
  - callbacks: default
  - paths: default
  - extras: default
  - hydra: default
  - codecarbon: default
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

team_name: data_team       # TODO write your team name HERE
experiment_name: dedup # TODO define this in your EXPERIMENT CONFIGS
tags: ["data", "train"]            # TODO define this in your EXPERIMENT CONFIGS

# First tag options: data, explore, baseline, ablate, hyperparam, final, <custom tag>
# Second tag options: train, pre-train, post-train, debug, <custom tag>
# Example: ["baseline", "train"]

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: 0

# some optimization
trainer:
  precision: 16-mixed

module:
  compile: True

# Drop near-duplicate training images listed in this imagededup CSV.
# Matching is path-prefix independent (<class>/<filename>), so the data home dir can differ
# from the CSV. Override on the CLI (e.g. datamodule.duplicates_csv=null to disable).
datamodule:
  duplicates_csv: ${paths.root_dir}/imagededup/duplicates_phash.csv
